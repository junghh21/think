<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상속 대응 정리</title>
<style>
body{margin:0;background:#fff;color:#111;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:22px;line-height:1.8}
main{max-width:760px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:32px;line-height:1.4}
h2{font-size:28px;margin-top:2em;border-bottom:3px solid #333;padding-bottom:6px}
h3{font-size:25px;margin-top:1.6em}
table{border-collapse:collapse;width:100%;font-size:20px}
th,td{border:1px solid #666;padding:10px;vertical-align:top}
th{background:#eee}
blockquote{margin:1em 0;padding:8px 16px;background:#f5f5f5;border-left:6px solid #888}
@media(max-width:700px){
table,thead,tbody,tr,td{display:block;width:auto}
thead{position:absolute;left:-9999px}
tr{border:2px solid #444;border-radius:8px;margin:0 0 18px;padding:4px 0;background:#fafafa}
td{border:0;padding:8px 14px;font-size:21px}
td.empty{display:none}
td::before{content:attr(data-label);display:block;font-size:17px;font-weight:700;color:#444;margin-bottom:2px}
}
ol,ul{padding-left:1.4em}
li{margin:.4em 0}
</style>
</head>
<body>
<main>
{{BODY}}
</main>
</body>
</html>
